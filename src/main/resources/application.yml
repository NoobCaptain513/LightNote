server:
  port: 8081

spring:
  application:
    name: lightnote
  http:
    client:
      read-timeout: 120s
      connect-timeout: 30s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/lightnote?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 123456
  flyway:
    enabled: false
  redis:
    cluster:
      refresh:
        adaptive-refresh: false
    host: 192.168.100.132
    port: 6379
    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  ai:
    dashscope:
      api-key: sk-b0e58e9d0ea3442481f7897adc849fdf

mybatis-plus:
  type-aliases-package: com.lightnote.entity

logging:
  level:
    com.lightnote: debug

ai:
  provider:
    type: spring-ai
  api-key: sk-b0e58e9d0ea3442481f7897adc849fdf
  model: qwen-max
  compatible-base-url: https://dashscope.aliyuncs.com/compatible-mode
  base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation

  embedding:
    base-url: ${AI_EMBEDDING_BASE_URL:${ai.compatible-base-url}}
    api-key: ${AI_EMBEDDING_API_KEY:${ai.api-key}}
    model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
    include-dimensions: ${AI_EMBEDDING_INCLUDE_DIMENSIONS:true}
    batch-size: ${AI_EMBEDDING_BATCH_SIZE:10}
    connect-timeout-seconds: ${AI_EMBEDDING_CONNECT_TIMEOUT_SECONDS:30}
    read-timeout-seconds: ${AI_EMBEDDING_READ_TIMEOUT_SECONDS:60}
  rag:
    pgvector:
      url: ${PGVECTOR_URL:jdbc:postgresql://192.168.100.132:5432/lightnote_rag}
      username: ${PGVECTOR_USERNAME:lightnote}
      password: ${PGVECTOR_PASSWORD:lightnote}
      candidate-k: ${RAG_CANDIDATE_K:12}
      min-score: ${RAG_MIN_SCORE:0.05}
  features:
    rag:
      top-k: 3
      vector-dimension: 64
      auto-rebuild-on-empty: true
    stream:
      chunk-size: 8
      chunk-delay-ms: 35
    cost:
      input-price-per-1k: 0.02
      output-price-per-1k: 0.06
