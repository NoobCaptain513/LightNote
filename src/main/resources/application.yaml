server:
  port: 8081

spring:
  application:
    name: hmdp
  http:
    client:
      read-timeout: 120s
      connect-timeout: 30s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 123456
  redis:
    cluster:
      refresh:
        adaptive-refresh: false
    host: 192.168.100.132
    port: 6379
    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  ai:
    dashscope:
      api-key: sk-b0e58e9d0ea3442481f7897adc849fdf

mybatis-plus:
  type-aliases-package: com.hmdp.entity

logging:
  level:
    com.hmdp: debug

ai:
  provider:
    type: langchain4j
  api-key: sk-b0e58e9d0ea3442481f7897adc849fdf
  model: qwen-max
  compatible-base-url: https://dashscope.aliyuncs.com/compatible-mode
  base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  features:
    rag:
      top-k: 3
      vector-dimension: 64
      auto-rebuild-on-empty: true
    stream:
      chunk-size: 8
      chunk-delay-ms: 35
    cost:
      input-price-per-1k: 0.02
      output-price-per-1k: 0.06
